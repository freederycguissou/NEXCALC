<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#171717">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculatrice scientifique</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<style>
:root{--page:#dfe1dc;--key:#353a44;--keyhi:#434955;--legend:#f2b84b;--lcd:#c3cdb0;--ink:#1c2315}
@media (prefers-color-scheme:dark){:root{--page:#0f1115}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--page);font-family:system-ui,sans-serif}

.calc{width:min(100%,400px);background:linear-gradient(#2c3039,#1c1f25);border-radius:26px 26px 36px 36px;padding:14px 16px 22px;box-shadow:0 22px 44px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:12px;color:#e8eaee;font-size:13px;font-weight:700}
.solar{flex:1;height:20px;border-radius:3px;background:repeating-linear-gradient(90deg,#2b2336 0 24px,#44385a 24px 25px);box-shadow:inset 0 0 0 2px #14161b}

.lcd{background:var(--lcd);color:var(--ink);border-radius:8px;padding:6px 12px 8px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;margin-bottom:14px;font-family:"Share Tech Mono",ui-monospace,monospace;box-shadow:inset 0 3px 7px rgba(0,0,0,.4),0 0 0 3px #14161b}
.status{display:flex;align-items:center;gap:10px;font-size:11px}
.status span{opacity:.18}
.status span.on{opacity:1}
#hbtn{margin-left:auto;font:inherit;font-size:16px;background:none;border:0;color:var(--ink);cursor:pointer;padding:0 2px}
#sub{font-size:13px;opacity:.6;text-align:right;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#out{font-size:32px;line-height:1.25;text-align:right;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
#out::-webkit-scrollbar{display:none}

#histPanel{max-height:150px;overflow-y:auto;margin-bottom:12px;background:#15181d;border-radius:8px;padding:6px}
#histPanel button{display:flex;justify-content:space-between;gap:12px;width:100%;background:none;border:0;color:#cfd3da;font:13px "Share Tech Mono",monospace;padding:6px;cursor:pointer;border-radius:4px}
#histPanel button:hover{background:#262a31}
#histPanel p{margin:6px;color:#8a909b;font-size:13px}

.grid{display:grid;gap:8px}
.sci{grid-template-columns:repeat(6,1fr);margin-bottom:16px}
.main{grid-template-columns:repeat(5,1fr)}
.k{position:relative;display:flex;align-items:flex-end;justify-content:center;height:46px;padding:0 0 6px;border:0;border-radius:7px 7px 11px 11px;cursor:pointer;font:inherit;font-size:13px;color:#eef0f3;background:linear-gradient(var(--keyhi),var(--key));box-shadow:0 3px 0 #0e1013}
.k b{font-weight:500}
.k small{position:absolute;top:3px;left:0;right:0;text-align:center;font-size:10px;color:var(--legend)}
.k:active{transform:translateY(2px);box-shadow:0 1px 0 #0e1013}
.k:focus-visible{outline:2px solid var(--legend);outline-offset:2px}
.k.on{box-shadow:0 3px 0 #0e1013,inset 0 0 0 2px var(--legend)}
.shift .k small{font-weight:700;filter:brightness(1.25)}
.shift .k[data-s] b,.shift .k[data-t] b{opacity:.4}

.main .k{height:52px;font-size:20px;align-items:center;padding:0}
.num{background:linear-gradient(#f3f3ee,#dcdcd5);color:#15171b;box-shadow:0 3px 0 #8d8d86}
.op{background:linear-gradient(#636976,#4f5460)}
.fn{background:linear-gradient(#e0574a,#c13d31);font-size:16px!important}
.eq{background:linear-gradient(#37a597,#278376);font-size:24px!important}
.main .op[data-v="Ans"],.main .op[data-v="E"]{font-size:15px}

@media (max-height:720px){.k{height:40px}.main .k{height:46px}.lcd{min-height:96px}}
@media (prefers-reduced-motion:reduce){.k:active{transform:none}}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<main class="calc">
  <header class="brand"><span> GUI_NEXEURA</span><div class="solar"></div></header>
  <section class="lcd" aria-live="polite">
    <div class="status">
      <span id="i-shift">2nd</span><span id="i-hyp">HYP</span><span id="i-mode">DEG</span><span id="i-mem">M</span>
      <button id="hbtn" aria-label="Historique">⟲</button>
    </div>
    <div id="sub"></div>
    <div id="out">0</div>
  </section>
  <div id="histPanel" hidden></div>
  <div class="grid sci" id="sci"></div>
  <div class="grid main" id="main"></div>
</main>
<script>
'use strict';
/* ---------- Touches ---------- */
// [libellé, valeur, légende (2nd), valeur 2nd]
const SCI = [
  ['2nd','shift'], ['hyp','hyp'], ['DEG','mode'], ['MC','mc'], ['MR','mr'], ['M+','m+','M−','m-'],
  ['sin','sin','sin⁻¹','a'], ['cos','cos','cos⁻¹','a'], ['tan','tan','tan⁻¹','a'], ['(','('], [')',')'], [',',','],
  ['ln','ln(','eˣ','exp('], ['log','log(','10ˣ','10^('], ['√','√(','∛','cbrt('],
  ['x²','^2','x³','^3'], ['xʸ','^','ʸ√x','^(1/'], ['1/x','^(−1)','|x|','abs('],
  ['n!','!'], ['nCr','C'], ['nPr','P'], ['mod',' mod '], ['gcd','gcd('], ['lcm','lcm('],
  ['π','π','Ran#','rand'], ['e','e'], ['%','%'], ['logₓ','logb(','2ˣ','2^('],
  ['⌊x⌋','floor(','round','round('], ['⌈x⌉','ceil(','sgn','sgn(']
];
const MAIN = [
  ['7','7','num'], ['8','8','num'], ['9','9','num'], ['DEL','del','fn'], ['AC','ac','fn'],
  ['4','4','num'], ['5','5','num'], ['6','6','num'], ['×','×','op'], ['÷','÷','op'],
  ['1','1','num'], ['2','2','num'], ['3','3','num'], ['+','+','op'], ['−','−','op'],
  ['0','0','num'], ['.','.','num'], ['EXP','E','op'], ['Ans','Ans','op'], ['=','eq','eq']
];
const $ = id => document.getElementById(id);
const sci = $('sci'), main = $('main'), out = $('out'), sub = $('sub'), panel = $('histPanel');

SCI.forEach(([l, v, gl, gv]) => {
  const b = document.createElement('button');
  b.className = 'k'; b.dataset.v = v;
  if (gv !== undefined) b.dataset.s = gv;
  if (gv === 'a') b.dataset.t = v;           // touche trigonométrique
  b.innerHTML = (gl ? `<small>${gl}</small>` : '') + `<b>${l}</b>`;
  sci.appendChild(b);
});
MAIN.forEach(([l, v, c]) => {
  const b = document.createElement('button');
  b.className = 'k ' + c; b.dataset.v = v; b.textContent = l;
  main.appendChild(b);
});

/* ---------- État ---------- */
let expr = '', ans = 0, mem = 0, mode = 0, shift = false, hyp = false, done = false;
const MODES = ['DEG', 'RAD', 'GRA'];
const HIST = [];

/* ---------- Moteur de calcul ---------- */
function tokenize(s) {
  s = s.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/π/g, ' pi ').replace(/√/g, ' sqrt ');
  const t = s.match(/(?:\d+\.?\d*|\.\d+)(?:E[+-]?\d+)?|[a-zA-Z]+|[-+*\/^()!%,]/g) || [];
  if (s.replace(/\s/g, '') !== t.join('')) throw Error('syntaxe');
  return t;
}
const fact = n => {
  if (n < 0 || n > 170 || n !== Math.floor(n)) throw Error('domaine');
  let r = 1; for (let i = 2; i <= n; i++) r *= i; return r;
};
const nCr = (n, r) => {
  if (n < 0 || r < 0 || r > n || n % 1 || r % 1) throw Error('domaine');
  r = Math.min(r, n - r); let c = 1;
  for (let i = 1; i <= r; i++) c = c * (n - r + i) / i;
  return Math.round(c);
};
const nPr = (n, r) => {
  if (n < 0 || r < 0 || r > n || n % 1 || r % 1) throw Error('domaine');
  let p = 1; for (let i = 0; i < r; i++) p *= n - i; return p;
};
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };

function calc(s) {
  const open = (s.match(/\(/g) || []).length - (s.match(/\)/g) || []).length;
  if (open > 0) s += ')'.repeat(open);               // ferme les parenthèses oubliées
  const t = tokenize(s); let i = 0;
  const peek = () => t[i], next = () => t[i++];
  const rad = x => mode === 0 ? x * Math.PI / 180 : mode === 2 ? x * Math.PI / 200 : x;
  const back = x => mode === 0 ? x * 180 / Math.PI : mode === 2 ? x * 200 / Math.PI : x;
  const F = {
    sin: x => Math.sin(rad(x)), cos: x => Math.cos(rad(x)),
    tan: x => { const r = rad(x); if (Math.abs(Math.cos(r)) < 1e-15) throw Error('domaine'); return Math.tan(r); },
    asin: x => back(Math.asin(x)), acos: x => back(Math.acos(x)), atan: x => back(Math.atan(x)),
    sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
    asinh: Math.asinh, acosh: Math.acosh, atanh: Math.atanh,
    ln: Math.log, log: Math.log10, logb: (x, b) => Math.log(x) / Math.log(b), exp: Math.exp,
    sqrt: Math.sqrt, cbrt: Math.cbrt, abs: Math.abs, sgn: Math.sign,
    floor: Math.floor, ceil: Math.ceil,
    round: (x, n = 0) => { const m = 10 ** n; return Math.round(x * m) / m; },
    gcd, lcm: (a, b) => a && b ? Math.abs(a * b) / gcd(a, b) : 0
  };
 const C = { pi: Math.PI, e: Math.E, Ans: ans, M: mem, get rand() { return Math.random(); } };

  function expression() { let v = term(); while (peek() === '+' || peek() === '-') v = next() === '+' ? v + term() : v - term(); return v; }
  function term() {
    let v = comb();
    for (;;) {
      const p = peek();
      if (p === '*') { next(); v *= comb(); }
      else if (p === '/') { next(); v /= comb(); }
      else if (p === 'mod') { next(); const m = comb(); if (!m) throw Error('div0'); v = ((v % m) + m) % m; }
      else if (p !== undefined && (p === '(' || /^[\d.a-zA-Z]/.test(p))) v *= comb();   // multiplication implicite
      else return v;
    }
  }
  function comb() {
    let v = unary();
    while (peek() === 'C' || peek() === 'P') { const o = next(), r = unary(); v = o === 'C' ? nCr(v, r) : nPr(v, r); }
    return v;
  }
  function unary() { if (peek() === '-') { next(); return -unary(); } if (peek() === '+') { next(); return unary(); } return power(); }
  function power() { const b = post(); if (peek() === '^') { next(); return Math.pow(b, unary()); } return b; }
  function post() { let v = prim(); for (;;) { if (peek() === '!') { next(); v = fact(v); } else if (peek() === '%') { next(); v /= 100; } else return v; } }
  function args() {
    const a = [];
    if (peek() === '(') { next(); if (peek() !== ')') { do a.push(expression()); while (peek() === ',' && next()); } if (peek() === ')') next(); }
    else a.push(unary());
    return a;
  }
  function prim() {
    const x = next();
    if (x === undefined) throw Error('syntaxe');
    if (/^[\d.]/.test(x)) return parseFloat(x);
    if (x === '(') { const v = expression(); if (peek() === ')') next(); return v; }
    if (x in C) return C[x];
    if (x in F) return F[x](...args());
    throw Error('syntaxe');
  }
  const r = expression();
  if (i < t.length || !isFinite(r)) throw Error('erreur');
  return Math.abs(r) < 1e-12 ? 0 : r;
}

function fmt(r) {
  if (r === 0) return '0';
  const a = Math.abs(r);
  if (a >= 1e12 || a < 1e-6) return r.toExponential(9).replace(/\.?0+e/, 'E').replace('+', '');
  return String(Number(r.toPrecision(12)));
}

/* ---------- Interface ---------- */
const show = () => { out.textContent = expr || '0'; out.scrollLeft = out.scrollWidth; };

function add(v) {
  if (done) { expr = /^(?:[+×÷−^!%]|C|P|mod)/.test(v.trim()) ? 'Ans' : ''; done = false; }
  expr += v; show();
}
function cur() { try { return calc(expr || '0'); } catch (_) { return null; } }
  function ui() {
  $('i-shift').classList.toggle('on', shift);
  $('i-hyp').classList.toggle('on', hyp);
  $('i-mem').classList.toggle('on', mem !== 0);
  $('i-mode').textContent = MODES[mode]; $('i-mode').classList.add('on');
  sci.classList.toggle('shift', shift);
  sci.querySelector('[data-v="shift"]').classList.toggle('on', shift);
  sci.querySelector('[data-v="hyp"]').classList.toggle('on', hyp);
  sci.querySelector('[data-v="mode"] b').textContent = MODES[mode];
  sci.querySelectorAll('[data-t]').forEach(b => {
    const n = b.dataset.t + (hyp ? 'h' : '');
    b.querySelector('b').textContent = n;
    b.querySelector('small').textContent = n + '⁻¹';
  });
}
  function renderHist() {
  panel.innerHTML = '';
  if (!HIST.length) { panel.innerHTML = '<p>Aucun calcul pour l’instant.</p>'; return; }
  HIST.forEach(([e, r]) => {
    const b = document.createElement('button');
    b.innerHTML = '<span></span><span></span>';
    b.children[0].textContent = e; b.children[1].textContent = '= ' + r;
    b.onclick = () => { add(r); panel.hidden = true; };
    panel.appendChild(b);
  });
}

function act(v) {
  switch (v) {
    case 'ac': expr = ''; sub.textContent = ''; done = false; show(); break;
    case 'del':
      if (done) { expr = ''; done = false; }
      else expr = expr.replace(/(?:asinh|acosh|atanh|asin|acos|atan|sinh|cosh|tanh|sin|cos|tan|ln|logb|log|exp|√|cbrt|abs|floor|ceil|round|sgn|gcd|lcm)\($| mod $|Ans$|rand$|.$/, '');
      show(); break;
    case 'eq':
      if (!expr) break;
      try {
        const r = calc(expr);
        sub.textContent = expr + ' ='; HIST.unshift([expr, fmt(r)]); HIST.length = Math.min(HIST.length, 30);
        ans = r; expr = fmt(r);
      } catch (_) { sub.textContent = expr; expr = 'Erreur'; }
      done = true; show(); renderHist(); break;
    case 'mode': mode = (mode + 1) % 3; ui(); break;
    case 'mc': mem = 0; ui(); break;
    case 'mr': add('M'); break;
    case 'm+': case 'm-': { const r = cur(); if (r !== null) { mem += v === 'm+' ? r : -r; ui(); } break; }
    default: add(v);
  }
}
  document.querySelector('.calc').addEventListener('click', e => {
  const b = e.target.closest('.k'); if (!b) return;
  let v = b.dataset.v;
  if (b.parentNode === sci) {
    if (v === 'shift') { shift = !shift; return ui(); }
    if (v === 'hyp') { hyp = !hyp; return ui(); }
    if (b.dataset.t) v = (shift ? 'a' : '') + v + (hyp ? 'h' : '') + '(';
    else if (shift && b.dataset.s !== undefined) v = b.dataset.s;
    shift = false; if (b.dataset.t) hyp = false;
    ui();
  }
  act(v);
});
  $('hbtn').onclick = () => { panel.hidden = !panel.hidden; };

document.addEventListener('keydown', e => {
  const k = e.key, m = { '*': '×', '/': '÷', '-': '−', '+': '+', '^': '^', '(': '(', ')': ')', '.': '.', ',': ',', '!': '!', '%': '%' };
  if (/^\d$/.test(k)) add(k);
  else if (m[k]) { e.preventDefault(); add(m[k]); }
  else if (k === 'Enter' || k === '=') { e.preventDefault(); act('eq'); }
  else if (k === 'Backspace') act('del');
  else if (k === 'Escape') act('ac');
});

renderHist(); ui(); show();

</script>
</body>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
  </script>
</html>
